# Static site config for the Docker image (replaces nginx's stock default.conf).
# Security headers: no framing by other origins (the reset button cannot be
# clickjacked), a Content-Security-Policy that only allows the app's own files
# (fonts are bundled, so no third-party origin is needed), no MIME sniffing, and
# no nginx version in responses or error pages.
server_tokens off;

server {
    listen       80;
    root   /usr/share/nginx/html;
    index  index.html;

    # 'unsafe-inline' is for styles only: the app sets inline style attributes and
    # injects its theme and report CSS in <style> elements.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
